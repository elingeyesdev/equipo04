services:
  postgres_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chirper
      POSTGRES_USER: sail
      POSTGRES_PASSWORD: password
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  web_app:
    build:
      context: ./
      dockerfile: ./.docker/Dockerfile.php
    volumes:
      - "./cosa web/chirper:/var/www/html"
    ports:
      - "8001:8001"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8001
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_DATABASE=chirper
      - DB_USERNAME=sail
      - DB_PASSWORD=password
      - FLOOD_API_BASE_URL=http://localhost:8001/api
      - FLOOD_API_INTERNAL=false
      - PHP_CLI_SERVER_WORKERS=4
      - QUEUE_CONNECTION=database
    depends_on:
      - postgres_db
    command: >
      php artisan serve --host=0.0.0.0 --port=8001
    networks:
      - app-network

  queue_worker:
    build:
      context: ./
      dockerfile: ./.docker/Dockerfile.php
    volumes:
      - "./cosa web/chirper:/var/www/html"
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_DATABASE=chirper
      - DB_USERNAME=sail
      - DB_PASSWORD=password
      - QUEUE_CONNECTION=database
    depends_on:
      - postgres_db
    command: php artisan queue:work --tries=3 --backoff=30
    networks:
      - app-network

  reverb:
    build:
      context: ./
      dockerfile: ./.docker/Dockerfile.php
    volumes:
      - "./cosa web/chirper:/var/www/html"
    ports:
      - "8081:8081"
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_DATABASE=chirper
      - DB_USERNAME=sail
      - DB_PASSWORD=password
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8081
    depends_on:
      - postgres_db
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
